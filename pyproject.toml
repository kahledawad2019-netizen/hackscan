[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hackscan"
dynamic = ["version"]
description = "Python SAST orchestrator: own AST + taint engine, imports Semgrep/Bandit/CodeQL/Gitleaks, dedupes, emits SARIF."
keywords = ["security", "sast", "static-analysis", "taint-analysis", "sarif", "vulnerability-scanner"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0.3",
    "rich>=13.7",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
hackscan = "hackscan.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hackscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/corpus", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.hatch.version]
path = "src/hackscan/__init__.py"

[project.urls]
Source = "https://github.com/kahledawad2019-netizen/hackscan"
Issues = "https://github.com/kahledawad2019-netizen/hackscan/issues"

[tool.ruff.lint.per-file-ignores]
# Inline code samples under test are clearer unwrapped.
"tests/test_remediate.py" = ["E501"]
"tests/test_llm.py" = ["E501"]
"tests/test_ui.py" = ["E501"]
